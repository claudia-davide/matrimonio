<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Claudia & Davide | 15 maggio 2027</title>

<style>

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Georgia, "Times New Roman", serif;
  color: #6e7465;

  background:
    radial-gradient(circle at 20% 15%, rgba(246,214,222,.28), transparent 25%),
    radial-gradient(circle at 80% 80%, rgba(198,218,231,.30), transparent 28%),
    #faf6ef;
}

/* SCENA */

.scene {
  position: relative;
  width: min(94vw, 430px);
  height: min(92vh, 760px);
}

/* TESTATA */

.header {
  position: absolute;
  top: 7%;
  left: 0;
  width: 100%;
  text-align: center;
  transition: opacity .8s ease, transform .8s ease;
}

.names {
  margin: 0;
  font-family: "Snell Roundhand", "Brush Script MT", cursive;
  font-weight: 400;
  font-size: clamp(42px, 12vw, 62px);
  line-height: 1;
  color: #68705f;
}

.date {
  margin-top: 20px;
  font-size: 15px;
  letter-spacing: 7px;
}

.chapter {
  margin-top: 18px;
  font-size: 10px;
  letter-spacing: 4px;
}

.heartline {
  margin: 12px auto 0;
  font-size: 16px;
  color: #d99da4;
}

/* AREA BUSTA */

.envelope-wrap {
  position: absolute;
  left: 50%;
  top: 48%;
  width: 350px;
  height: 235px;
  transform: translate(-50%, -50%);
  cursor: pointer;
  perspective: 1000px;
}

/* OMBRA */

.envelope-wrap::after {
  content: "";
  position: absolute;
  width: 88%;
  height: 30px;
  left: 6%;
  bottom: -22px;
  border-radius: 50%;
  background: rgba(79,65,52,.18);
  filter: blur(15px);
  z-index: -2;
}

/* RETRO */

.back {
  position: absolute;
  inset: 0;
  background: #f3ecdf;
  border-radius: 4px;
  box-shadow: 0 15px 30px rgba(80,65,50,.13);
}

/* CARTONCINO */

.invitation {
  position: absolute;
  left: 25px;
  bottom: 10px;

  width: 300px;
  height: 410px;

  padding: 38px 24px;

  background: #fffdf8;

  text-align: center;
  color: #6b7163;

  box-shadow: 0 12px 35px rgba(70,60,50,.18);

  transform: translateY(0) scale(.96);

  transition:
    transform 1.5s cubic-bezier(.22,.8,.22,1),
    box-shadow 1s ease;

  z-index: 2;
}

.inv-small {
  font-size: 9px;
  letter-spacing: 3px;
  line-height: 1.7;
}

.inv-names {
  font-family: "Snell Roundhand", "Brush Script MT", cursive;
  font-size: 39px;
  margin: 18px 0;
}

.inv-date {
  letter-spacing: 4px;
  font-size: 14px;
}

.inv-line {
  width: 42px;
  height: 1px;
  background: #d7aaa8;
  margin: 20px auto;
}

.inv-details {
  font-size: 11px;
  line-height: 1.8;
}

/* PATTA */

.flap {
  position: absolute;
  inset: 0;

  background: #eee6da;

  clip-path: polygon(0 0, 100% 0, 50% 72%);

  transform-origin: top;
  transition:
    transform 1.1s cubic-bezier(.45,0,.2,1),
    z-index 0s linear .55s;

  z-index: 6;
}

/* FIORI SULLA PATTA */

.flap::after {
  content: "❀  ·  ✿   ❀     ✿  ·  ❀";
  position: absolute;
  top: 38px;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 19px;
  letter-spacing: 6px;
  color: #aab9a1;
  opacity: .75;
}

/* FRONTE BUSTA */

.front-left,
.front-right,
.front-bottom {
  position: absolute;
  inset: 0;
  z-index: 5;
}

.front-left {
  background: #f7f0e6;
  clip-path: polygon(0 0, 51% 58%, 0 100%);
}

.front-right {
  background: #f4ece1;
  clip-path: polygon(100% 0, 49% 58%, 100% 100%);
}

.front-bottom {
  background: #faf4ea;
  clip-path: polygon(0 100%, 50% 51%, 100% 100%);
}

/* NASTRO ORIZZONTALE */

.ribbon-band {
  position: absolute;
  z-index: 10;

  left: -2px;
  top: 108px;

  width: 354px;
  height: 12px;

  background:
    linear-gradient(
      to bottom,
      #e6bdc0,
      #dca9ae 45%,
      #e9c4c5
    );

  box-shadow: 0 2px 4px rgba(80,60,60,.12);

  transition:
    opacity .6s ease 1s,
    transform .8s ease 1s;
}

/* FIOCCO */

.bow {
  position: absolute;
  z-index: 12;

  left: 50%;
  top: 114px;

  width: 70px;
  height: 35px;

  transform: translate(-50%, -50%);
}

/* NODO */

.knot {
  position: absolute;
  left: 50%;
  top: 50%;

  width: 18px;
  height: 18px;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background: #d7a2a7;

  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.4),
    0 2px 4px rgba(80,50,50,.18);

  transition:
    opacity .25s ease .45s,
    transform .5s ease;
}

/* ASOLE */

.loop {
  position: absolute;
  top: 2px;

  width: 42px;
  height: 27px;

  border: 8px solid #ddaeb2;

  transition: transform .9s cubic-bezier(.4,0,.2,1);
}

.loop.left {
  right: 36px;
  border-radius: 60% 40% 55% 45%;
  transform: rotate(13deg);
}

.loop.right {
  left: 36px;
  border-radius: 40% 60% 45% 55%;
  transform: rotate(-13deg);
}

/* CODE FIOCCO */

.tail {
  position: absolute;

  top: 18px;

  width: 12px;
  height: 120px;

  background:
    linear-gradient(
      90deg,
      #d7a4a9,
      #edc6c8 50%,
      #d6a0a6
    );

  transform-origin: top;

  transition:
    transform 1.3s cubic-bezier(.3,.7,.2,1),
    opacity .7s ease 1s;
}

.tail.left {
  right: 33px;
  transform: rotate(22deg);
}

.tail.right {
  left: 33px;
  transform: rotate(-22deg);
}

/* TOCCA */

.tap {
  position: absolute;
  bottom: 7%;
  width: 100%;

  text-align: center;

  font-size: 11px;
  letter-spacing: 4px;

  transition: opacity .5s ease;
}

.hand {
  display: block;
  font-size: 28px;
  margin-bottom: 10px;

  animation: tap 1.8s infinite;
}

@keyframes tap {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* =========================
   ANIMAZIONE APERTURA
   ========================= */

/* le asole si allargano */

.scene.open .loop.left {
  transform: translate(-55px,10px) rotate(-25deg) scaleX(1.25);
}

.scene.open .loop.right {
  transform: translate(55px,10px) rotate(25deg) scaleX(1.25);
}

/* nodo sparisce */

.scene.open .knot {
  opacity: 0;
  transform: translate(-50%, -50%) scale(.5);
}

/* code che scivolano */

.scene.open .tail.left {
  transform: translate(-75px,35px) rotate(50deg);
  opacity: 0;
}

.scene.open .tail.right {
  transform: translate(75px,35px) rotate(-50deg);
  opacity: 0;
}

/* nastro orizzontale sparisce */

.scene.open .ribbon-band {
  opacity: 0;
  transform: scaleX(1.08);
}

/* fiocco intero sparisce */

.scene.open .bow {
  pointer-events: none;
}

/* la patta si apre DOPO il fiocco */

.scene.open .flap {
  transform: rotateX(180deg);
  z-index: 1;
  transition-delay: 1.25s;
}

/* cartoncino esce */

.scene.open .invitation {
  transform: translateY(-275px) scale(1.03);
  box-shadow: 0 22px 50px rgba(70,60,50,.22);
  transition-delay: 2.05s;
  z-index: 15;
}

/* intestazione iniziale scompare */

.scene.open .header {
  opacity: 0;
  transform: translateY(-25px);
  transition-delay: 2s;
}

/* istruzione scompare */

.scene.open .tap {
  opacity: 0;
}

/* MOBILE */

@media (max-width: 390px) {

  .envelope-wrap {
    transform: translate(-50%, -50%) scale(.88);
  }

}

</style>
</head>

<body>

<div class="scene" id="scene">

  <div class="header">

    <h1 class="names">
      Claudia & Davide
    </h1>

    <div class="date">
      15 · 05 · 2027
    </div>

    <div class="chapter">
      UN NUOVO CAPITOLO INSIEME
    </div>

    <div class="heartline">
      ─── ♥ ───
    </div>

  </div>


  <div class="envelope-wrap" id="envelope">

    <div class="back"></div>

    <div class="invitation">

      <div class="inv-small">
        SIAMO FELICI DI INVITARVI<br>
        AL NOSTRO MATRIMONIO
      </div>

      <div class="inv-names">
        Claudia & Davide
      </div>

      <div class="inv-date">
        15 MAGGIO 2027
      </div>

      <div style="margin-top:10px;">
        ORE 11:00
      </div>

      <div class="inv-line"></div>

      <div class="inv-details">

        CHIESA DI<br>
        <strong>SAN BENEDETTO ABATE</strong><br>
        Bertesinella · Vicenza

        <br><br>

        A SEGUIRE<br>

        <strong>IL FARO</strong><br>

        Via Sega 50<br>
        Castione (TV)

      </div>

    </div>

    <div class="flap"></div>

    <div class="front-left"></div>
    <div class="front-right"></div>
    <div class="front-bottom"></div>

    <div class="ribbon-band"></div>

    <div class="bow">

      <div class="loop left"></div>
      <div class="loop right"></div>

      <div class="tail left"></div>
      <div class="tail right"></div>

      <div class="knot"></div>

    </div>

  </div>


  <div class="tap">

    <span class="hand">☝︎</span>

    TOCCA PER APRIRE

    <div style="
      color:#d99da4;
      margin-top:14px;
      font-size:14px;
      letter-spacing:2px;
    ">
      ─── ♥ ───
    </div>

  </div>

</div>


<script>

const scene = document.getElementById("scene");
const envelope = document.getElementById("envelope");

let opened = false;

envelope.addEventListener("click", function () {

  if (opened) return;

  opened = true;

  scene.classList.add("open");

});

</script>

</body>
</html>
