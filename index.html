<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Claudia & Davide — 15.05.2027</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #f8f2e9;
      overflow: hidden;
    }

    body {
      font-family: Georgia, serif;
    }

    #invitation {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8f2e9;
    }

    .media-wrapper {
      position: relative;
      height: 100dvh;
      max-height: 100dvh;
      aspect-ratio: 2 / 3;
      max-width: 100vw;
      overflow: hidden;
      background: #f8f2e9;
    }

    #cover,
    #openingVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #cover {
      z-index: 2;
      cursor: pointer;
      transition: opacity 0.18s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #openingVideo {
      z-index: 1;
      opacity: 0;
      background: #f8f2e9;
    }

    .playing #openingVideo {
      opacity: 1;
    }

    .playing #cover {
      opacity: 0;
      pointer-events: none;
    }

    #continueScreen {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 32px;
      background: #f8f2e9;
      color: #6f7465;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease;
    }

    #continueScreen.visible {
      opacity: 1;
      visibility: visible;
    }

    #continueScreen h1 {
      font-weight: normal;
      font-size: clamp(36px, 9vw, 64px);
      margin-bottom: 18px;
      font-style: italic;
    }

    #continueScreen p {
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <main id="invitation">
    <div class="media-wrapper" id="mediaWrapper">

      <video
        id="openingVideo"
        playsinline
        preload="auto"
        muted
      >
        <source
          src="Ribbon_unties_and_envelope_opens_20260922224925.mp4"
          type="video/mp4"
        >
      </video>

      <img
        id="cover"
        src="Invito%20floreale%20romantico%20Claudia%20%26%20Davide.png"
        alt="Invito al matrimonio di Claudia e Davide"
      >

    </div>
  </main>

  <section id="continueScreen">
    <h1>Claudia & Davide</h1>
    <p>
      15 · 05 · 2027<br>
      Il nostro matrimonio
    </p>
  </section>

  <script>
    const wrapper = document.getElementById("mediaWrapper");
    const cover = document.getElementById("cover");
    const video = document.getElementById("openingVideo");
    const continueScreen = document.getElementById("continueScreen");

    let started = false;

    async function openInvitation() {
      if (started) return;
      started = true;

      try {
        video.currentTime = 0;
        await video.play();
        wrapper.classList.add("playing");
      } catch (error) {
        started = false;
        console.error("Impossibile avviare il video:", error);
      }
    }

    cover.addEventListener("click", openInvitation);

    video.addEventListener("ended", () => {
      continueScreen.classList.add("visible");

      setTimeout(() => {
        document.getElementById("invitation").style.display = "none";
      }, 850);
    });
  </script>

</body>
</html>
